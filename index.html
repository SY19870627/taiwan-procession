<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>遶境</title>
    <meta name="theme-color" content="#120f1c" />
    <!-- 加到主畫面後可以全螢幕玩（iPhone 不支援網頁全螢幕） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="遶境" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#120f1c;height:100%;margin:0;overflow:hidden}#game{left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);position:fixed}#rotate,#ios-tip{z-index:10;color:#fbf3e2;text-align:center;font-family:Noto Sans TC,sans-serif;position:fixed}#rotate{background:#120f1c;flex-direction:column;justify-content:center;align-items:center;gap:16px;font-size:20px;font-weight:900;display:none;inset:0}#rotate .phone{border:4px solid #e9b949;border-radius:10px;width:46px;height:78px;animation:1.6s ease-in-out infinite turn}@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,to{transform:rotate(0)}}@media (orientation:landscape) and (pointer:coarse){#rotate{display:flex}}#ios-tip{white-space:nowrap;background:#1e182ceb;border:1px solid #e9b949;border-radius:8px;padding:4px 26px 4px 10px;font-size:11px;display:none;top:4px;left:50%;transform:translate(-50%)}#ios-tip button{color:#e9b949;background:0 0;border:0;font-size:16px;position:absolute;top:0;right:2px}</style>
    <script type="module" crossorigin src="./assets/index-CavZnLFF.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>請把手機轉成直向來玩</div>
    <div id="ios-tip">想全螢幕玩：點「分享」→「加入主畫面」，再從主畫面開啟<button aria-label="關閉">×</button></div>
  </body>
</html>
